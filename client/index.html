<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- ── SEO ──────────────────────────────────────────────── -->
    <title>ChatApp — Real-time Messaging</title>
    <meta name="description" content="ChatApp — Private real-time messaging with Google Login. Send messages, create groups, share files. Like WhatsApp on the web." />
    <meta name="keywords" content="chat, messaging, real-time, whatsapp, group chat" />

    <!-- ── PWA Manifest ─────────────────────────────────────── -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#060a10" />

    <!-- ── iOS (iPhone/iPad) PWA Support ────────────────────── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ChatApp" />

    <!-- ── Android Chrome ───────────────────────────────────── -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="ChatApp" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />

    <!-- ── Fonts (preloaded for performance) ─────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
